# Keeps public/contests.json — the FALLBACK list — current.
#
# The live path is /api/contests, which fetches the sources per request, so the
# dashboard no longer depends on this job having run. This file is what hosts
# that cannot run a function (GitHub Pages) serve, and it is committed on the
# default branch only: a build from any other branch carries whatever snapshot
# was committed when that branch was cut. That branch coupling is why the panel
# looked stale while this job was running perfectly, and why the client now
# treats the file as a backstop rather than the source of truth.
name: Refresh contest list

on:
  schedule:
    # Every 3 hours, not 6. GitHub delays scheduled runs under load and drops
    # them outright often enough that a 6-hour cadence produced day-old data.
    # Halving the interval means a missed run costs 3 hours instead of 6, and
    # the job is a no-op commit when nothing changed.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Codeforces contests
        run: node scripts/fetch-contests.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/contests.json; then
            echo "No change."
            exit 0
          fi
          git add public/contests.json
          git commit -m "chore: refresh contest list"
          # A merge landing between checkout and push would otherwise reject
          # this as non-fast-forward, and the run would fail silently until
          # somebody noticed the dates had stopped moving.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying."
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push the refreshed contest list after 3 attempts."
          exit 1

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DSA 140">
  <title>DSA 140</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B52EA"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- Brand tile, matching the in-app logo mark so the tab reads as the same thing. -->
  <rect width="32" height="32" rx="7.5" fill="url(#tile)"/>

  <!-- A binary tree: the one DSA motif that still resolves at 16px, where the
       "140" wordmark would collapse into mush. Edges are drawn first so the
       nodes sit on top of them. -->
  <g stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <line x1="16" y1="10" x2="9" y2="22"/>
    <line x1="16" y1="10" x2="23" y2="22"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="16" cy="9.5" r="4.1"/>
    <circle cx="9" cy="22.5" r="4.1"/>
    <circle cx="23" cy="22.5" r="4.1"/>
  </g>
</svg>
